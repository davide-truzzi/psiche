<!DOCTYPE html>
<!-- The XHTML page the PDF is laid out from, as the renderer reads it: the head carries the PDF's title, author and
     language, the manuscript's stylesheet and, for the book, its bookmarks. -->
<html xmlns="http://www.w3.org/1999/xhtml" lang="{{language}}">
<head>
<meta charset="utf-8" />
<title>{{title}}</title>
<meta name="author" content="{{authors}}" />
<style>{{style}}</style>
{{head}}</head>
<body>
{{body}}</body>
</html>
