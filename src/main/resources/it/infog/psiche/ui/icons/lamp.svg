  <!-- The oil lamp of "Keep the lamp lit": glass chimney and flame, burner with its wick wheel, glass font on a
       foot. Drawn by the brand bundle's psiche-lamp.svg, its strokes turned into one filled outline, as JavaFX
       fills a region's shape. Two uses:
       - the toolbar's lamp takes the outline alone (the path), .support-lamp in writer.css giving the yellow and
         the size; the glowing disc behind it is a circle, which Icons does not read;
